<title>Monitor de Renda Fixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F4;--surface:#FFFFFF;--ink:#13201E;--muted:#5A6A67;--line:#D8E0DD;--accent:#0B6E63;--accent-ink:#FFFFFF;
  --chip:#E4EEEB;--good:#17803A;--good-bg:#E3F4E8;--warn:#9A5A06;--warn-bg:#FBF0DC;--bad:#B42318;--bad-bg:#FBE6E4;
  --bar-lo:#17803A;--bar-mid:#C9D3D0;--bar-hi:#B42318;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0C1312;--surface:#131C1A;--ink:#E2ECE9;--muted:#93A6A2;--line:#243330;--accent:#3CC4AF;--accent-ink:#0C1312;
  --chip:#1B2926;--good:#52D98A;--good-bg:#12301F;--warn:#F2B35A;--warn-bg:#33260F;--bad:#F47C73;--bad-bg:#3A1714;
  --bar-lo:#52D98A;--bar-mid:#3A4A46;--bar-hi:#F47C73;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0C1312;--surface:#131C1A;--ink:#E2ECE9;--muted:#93A6A2;--line:#243330;--accent:#3CC4AF;--accent-ink:#0C1312;
  --chip:#1B2926;--good:#52D98A;--good-bg:#12301F;--warn:#F2B35A;--warn-bg:#33260F;--bad:#F47C73;--bad-bg:#3A1714;
  --bar-lo:#52D98A;--bar-mid:#3A4A46;--bar-hi:#F47C73;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1320px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 14px;border-bottom:1px solid var(--line)}
h1{font:600 26px/1.1 var(--cond);letter-spacing:.01em;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.regime{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
nav{display:flex;gap:4px;margin-block:14px 18px;flex-wrap:wrap}
nav button{font:500 13.5px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font:600 16px/1.2 var(--cond);letter-spacing:.02em;margin:0 0 10px}
h3{font:600 13px var(--sans);margin:14px 0 6px}
p.note{color:var(--muted);font-size:12.5px;max-width:95ch;margin:8px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:500 20px var(--mono);margin-top:2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px}
tr:last-child td{border-bottom:0}
.nm{font-weight:600}.mut{color:var(--muted);font-size:12px}
.up{color:var(--good)}.down{color:var(--bad)}.w{color:var(--warn)}
.spark{display:block;max-width:100%}
.range{position:relative;height:6px;width:96px;border-radius:3px;background:linear-gradient(90deg,var(--bar-lo),var(--bar-mid),var(--bar-hi));margin-block:5px 3px}
.range i{position:absolute;top:-3px;width:3px;height:12px;border-radius:1px;background:var(--ink);transform:translateX(-1px)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,input{font:13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.bars td{padding:5px 8px}.barcell{width:45%}.bar{height:8px;border-radius:4px;background:var(--accent)}
figure{margin:0}figure img{display:block;width:100%;max-width:1100px;border-radius:6px;border:1px solid var(--line);background:#fff}
figcaption{color:var(--muted);font-size:12px;margin-top:6px}
ul.find{margin:6px 0 0;padding-left:18px;max-width:100ch}ul.find li{margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
tr.star td{background:var(--good-bg)}
@media (prefers-reduced-motion:no-preference){nav button{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Monitor de Renda Fixa</h1>
      <div class="sub" id="meta"></div>
    </div>
    <div class="regime" id="regime"></div>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="carteira" id="tab-carteira">Carteira</button>
    <button role="tab" data-tab="oportunidades" id="tab-oportunidades">Oportunidades</button>
    <button role="tab" data-tab="pesquisa" id="tab-pesquisa">Pesquisa</button>
  </nav>

  <section id="carteira" role="tabpanel"></section>

  <section id="oportunidades" role="tabpanel" hidden>
    <div class="panel">
      <h2>Oportunidades · estratégia P4</h2>
      <p class="note" id="p4note" style="margin-top:0"></p>
      <div class="filters" style="margin-top:12px">
        <select id="f_strat" aria-label="Estratégia">
          <option value="">Todas as estratégias</option>
          <option value="C3 · comprar">Comprar (P4)</option>
          <option value="C3 · aguardar">Aguardar regime</option>
          <option value="C3 · não comprar (ação">Não comprar (ação caiu / rebaixado)</option>
          <option value="C3 · não comprar (imprensa">Não comprar (imprensa)</option>
          <option value="VENDER">Vender (caro)</option>
        </select>
        <select id="f_peer" aria-label="Grupo"><option value="">Todos os grupos</option></select>
        <label class="chk">Duration <input id="f_dmin" type="number" step="0.5" value="0" style="width:64px"> a <input id="f_dmax" type="number" step="0.5" value="15" style="width:64px"></label>
        <label class="chk"><input type="checkbox" id="f_noflag"> esconder com alerta</label>
        <input id="f_q" placeholder="Buscar emissor ou código" style="min-width:200px">
      </div>
      <div class="scroll"><table id="opp"></table></div>
      <p class="note" id="oppcount"></p>
    </div>
  </section>

  <section id="pesquisa" role="tabpanel" hidden></section>
</div>

<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d = 0) => v === null || v === undefined || Number.isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (v, d = 0) => v === null || v === undefined ? "—" : (v > 0 ? "+" : "") + num(v, d);
const chg = v => v === null || v === undefined ? '<span class="mut">—</span>' : `<span class="${v > 0 ? "down" : v < 0 ? "up" : "mut"}">${sgn(v)}</span>`;

// header
$("meta").textContent = `Atualizado em ${D.generated} (Brasília)${D.auto ? " · atualiza sozinho a cada ~30 min em dias úteis" : ""} · preços ANBIMA de ${D.anbima_date ?? "—"} · somente leitura`;
const reg = (D.regime && D.regime.series) || {};
$("regime").innerHTML = Object.entries(reg).map(([k, r]) =>
  `<span class="pill ${r.position >= 1 ? "good" : "bad"}" title="${esc(r.model)} · ${esc(r.asof)}"><span class="dot"></span>${esc(k.split(" (")[0])}: ${r.position >= 1 ? "risk-on" : "defensivo"}</span>`).join("");

// tabs
function show(tab) {
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  for (const s of ["carteira", "oportunidades", "pesquisa"]) $(s).hidden = s !== tab;
  try { localStorage.setItem("rfm_tab", tab); } catch (e) {}
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
let start = (location.hash || "").slice(1);
if (!["carteira", "oportunidades", "pesquisa"].includes(start)) { try { start = localStorage.getItem("rfm_tab") || "carteira"; } catch (e) { start = "carteira"; } }

// carteira
function spreadCell(r) {
  if (r.spread !== null && r.spread !== undefined) return `<b>${esc(r.label)} ${num(r.spread)}</b>`;
  if (r.yield !== null && r.yield !== undefined) return `taxa ${num(r.yield, 2)}%`;
  if (r.pct_par !== null && r.pct_par !== undefined) return `<span class="down">${num(r.pct_par, 1)}% do par</span><div class="mut">sem taxa ANBIMA</div>`;
  return "—";
}
function rangeCell(r) {
  if (r.hist_pct === null || r.hist_pct === undefined) return `<span class="mut">${r.hist_n ?? 0} obs</span>`;
  return `<div class="range"><i style="left:${Math.max(0, Math.min(100, r.hist_pct))}%"></i></div><div class="mut">${Math.round(r.hist_pct)}º pct · z ${sgn(r.hist_z, 1)}</div>`;
}
function verdictCell(v) {
  const cls = v.startsWith("Barato") ? "up" : v.startsWith("Caro") ? "down" : "mut";
  return `<span class="${cls}">${esc(v)}</span>`;
}
function spark(s) {
  if (!s || !s.v || s.v.length < 2) return "";
  const w = 150, h = 34, v = s.v, lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 3 - (y - lo) / span * (h - 6)).toFixed(1)}`).join(" ");
  const last = pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${s.kind === "spread" ? "Spread" : "Preço"} de ${s.d[0]} a ${s.d[s.d.length - 1]}: mín ${num(lo)}, máx ${num(hi)}">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--accent)"/></svg>
    <div class="mut">${s.kind === "spread" ? "spread" : "preço"} ${esc(s.d[0].slice(2, 7))}→ · ${num(lo)}–${num(hi)}</div>`;
}
function assetRows(rows, withPos) {
  if (!rows.length) return `<tr><td colspan="11" class="mut">Nenhum ativo.</td></tr>`;
  return rows.map(r => `<tr>
    <td><div class="nm">${esc(r.name)}</div><div class="mut">${esc(r.index)} · venc. ${esc(r.maturity ?? "—")}</div>
      ${r.alert ? `<div class="mut ${r.alert_high ? "down" : ""}">${esc(r.alert.slice(0, 90))}</div>` : ""}</td>
    <td class="n">${num(r.duration, 2)}</td>
    <td class="n">${spreadCell(r)}</td>
    <td class="n">${chg(r.d1)} / ${chg(r.d5)} / ${chg(r.d20)}</td>
    <td>${rangeCell(r)}</td>
    <td>${spark(r.series)}</td>
    <td class="n">${num(r.fair)}</td>
    <td class="n">${num(r.price, 2)}${r.fair_price ? `<div class="mut">→ ${num(r.fair_price, 2)} <span class="${r.upside > 0 ? "up" : "down"}">(${sgn(r.upside, 1)}%)</span></div>` : ""}</td>
    <td>${verdictCell(r.verdict || "—")}</td>
    ${withPos ? `<td class="n">R$ ${num(r.mv)}<div class="mut">${num(r.weight, 1)}%</div></td>` : `<td class="mut">${r.stock ? esc(r.stock) + " " + num(r.stock_close, 2) : "—"}</td>`}
    <td><b>${esc(r.action)}</b>${r.blocks && r.blocks.length ? `<div class="mut w">${esc(r.blocks.join("; "))}</div>` : ""}</td>
  </tr>`).join("");
}
const head = pos => `<tr><th>Ativo</th><th class="n">Duration</th><th class="n">Spread</th><th class="n">Δ 1d / 5d / 20d</th><th>Faixa histórica</th><th>Histórico</th><th class="n">Justo</th><th class="n">Preço → justo</th><th>Veredito</th><th${pos ? ' class="n">Valor' : ">Ação emissor"}</th><th>Ação</th></tr>`;
const S = D.summary || {};
$("carteira").innerHTML = `
  ${D.held.length ? `<div class="kpis">
    <div class="panel kpi"><div class="l">Valor de mercado</div><div class="v">R$ ${num(S.mv)}</div></div>
    <div class="panel kpi"><div class="l">Duration média</div><div class="v">${num(S.duration, 2)}</div></div>
    <div class="panel kpi"><div class="l">Spread médio</div><div class="v">CDI+ ${num(S.spread)}</div></div>
    <div class="panel kpi"><div class="l">Carry de spread</div><div class="v">R$ ${num(S.carry)}/ano</div></div>
    <div class="panel kpi"><div class="l">CS01</div><div class="v">R$ ${num(-(S.cs01 || 0))}</div></div>
  </div>
  <div class="panel"><h2>Posições</h2><div class="scroll"><table>${head(true)}${assetRows(D.held, true)}</table></div></div>` : ""}
  <div class="panel"><h2>Monitorados</h2><div class="scroll"><table>${head(false)}${assetRows(D.watched, false)}</table></div>
    <p class="note">Spread em CDI+ equivalente (DI+, %DI, Pré e IPCA+ na mesma régua; eurobonds vs Treasuries). Faixa histórica: onde o spread está no próprio histórico desde 2021 (verde = spread baixo, preço alto; vermelho = spread alto, preço baixo). Justo: curva de pares do mesmo indexador e tratamento tributário. Preço justo: preço se o spread convergir ao justo.</p></div>
  <div class="panel"><h2>Alertas recentes</h2><table>${(D.alerts || []).map(a => `<tr><td class="mut" style="width:130px">${esc(a.ts)}</td><td class="${a.high ? "down" : ""}">${esc(a.msg)}</td></tr>`).join("") || '<tr><td class="mut">Sem alertas.</td></tr>'}</table></div>`;

// oportunidades
$("p4note").innerHTML = `Carrega o top 30% de CDI+ que <b>não</b> está caro vs pares, <b>não compra</b> emissor com notícia negativa na imprensa nos últimos 30 dias, com ação em queda de 15% ou mais em 4 semanas ou rebaixado nos últimos 180 dias, <b>vende</b> os caros e vai para CDI quando o regime está defensivo. Regime hoje: ${D.regime_on ? '<span class="pill good">risk-on</span>' : '<span class="pill bad">defensivo → CDI</span>'} · ${D.ranked} de ${D.universe} debêntures ranqueadas · ${D.c3_n} na carteira C3 · ${D.rich_n} caras.`;
const peers = [...new Set(D.opp.map(r => r.peer).filter(Boolean))].sort();
peers.forEach(p => $("f_peer").add(new Option(p, p)));
function stratCls(s) { return s.startsWith("VENDER") ? "bad" : s.startsWith("C3 · comprar") ? "good" : s.startsWith("C3") ? "warn" : ""; }
function renderOpp() {
  const st = $("f_strat").value, pe = $("f_peer").value, q = $("f_q").value.trim().toUpperCase();
  const dmin = parseFloat($("f_dmin").value) || 0, dmax = parseFloat($("f_dmax").value) || 99, nf = $("f_noflag").checked;
  const rows = D.opp.filter(r => (!st || (r.strategy || "").startsWith(st)) && (!pe || r.peer === pe)
    && (r.duration ?? 0) >= dmin && (r.duration ?? 0) <= dmax && (!nf || !(r.flags || []).length)
    && (!q || ((r.nome || "") + " " + (r.codigo || "")).toUpperCase().includes(q)));
  $("opp").innerHTML = `<tr><th class="n">#</th><th>Ativo</th><th>Indexador · taxa</th><th class="n">Duration</th><th class="n">CDI+</th><th class="n">Justo</th><th class="n">vs justo</th><th class="n">Δ5d</th><th class="n">PU → justo</th><th>Estratégia</th><th class="n">Modelo</th></tr>` +
    rows.slice(0, 200).map(r => `<tr>
      <td class="n">${r.rank}</td>
      <td><div class="nm">${esc(r.codigo)} <span class="mut">${esc(r.isin || "")}</span></div><div class="mut">${esc(r.nome)} · venc. ${esc(r.vencimento)}</div>
        ${(r.flags || []).length ? `<div class="mut w">${esc(r.flags.join(" · ").slice(0, 110))}</div>` : ""}</td>
      <td class="mut">${esc(r.indice)} · ${num(r.taxa_indicativa, 2)}${r.group === "DI_SPREAD" ? "" : "%"}<div>${esc(r.peer)}</div></td>
      <td class="n">${num(r.duration, 2)}</td>
      <td class="n"><b>${num(r.spread_bps)}</b></td>
      <td class="n">${num(r.fair_bps)}</td>
      <td class="n ${r.resid_bps > 0 ? "up" : "down"}">${sgn(r.resid_bps)}</td>
      <td class="n">${chg(r.chg_5d_bps)}</td>
      <td class="n">${num(r.pu, 2)}<div class="mut">→ ${num(r.fair_pu, 2)} <span class="${r.upside_pct > 0 ? "up" : "down"}">(${sgn(r.upside_pct, 1)}%)</span></div></td>
      <td><span class="pill ${stratCls(r.strategy || "")}">${esc(r.strategy || "—")}</span>
        ${r.press_neg_30d ? `<div class="mut w" title="${esc((r.press_titles || []).join(" | "))}">${r.press_neg_30d} notícia(s) negativa(s) em 30d</div>` : ""}</td>
      <td class="n">${r.model_pct === null || r.model_pct === undefined ? '<span class="mut">—</span>' : "top " + Math.max(1, Math.round(r.model_pct * 100)) + "%"}</td>
    </tr>`).join("");
  $("oppcount").textContent = `${rows.length} ativos no filtro (mostrando até 200, na ordem do ranking).`;
}
["f_strat", "f_peer", "f_dmin", "f_dmax", "f_noflag", "f_q"].forEach(id => $(id).addEventListener("input", renderOpp));
renderOpp();

// pesquisa
const lab = (D.lab || []).slice().sort((a, b) => (b.sharpe ?? -9) - (a.sharpe ?? -9));
const tim = D.timing || {};
const L3 = D.lab3;
const lab3Html = !L3 ? "" : `
  <div class="panel"><h2>O que aprendemos: ação, rating, commodities, regulador e notícia setorial</h2>
    <p class="note" style="margin-top:0">Mesmo protocolo (semanal 2022–26, crédito puro, execução na semana seguinte, 25 bps; robustez com atraso de 2 semanas e 50 bps). Dados com data de divulgação: preço e volume de 161 ações (68% dos títulos, emissor ou controladora), 53 séries de commodities/energia/macro, mapa de custos e receitas de 967 emissores, 1.033 ações de rating, 6.334 decisões de reguladores e 27,7 mil manchetes setoriais.</p>
    <ul class="find">
      <li><b>Rebaixamento de rating e queda forte da ação são alertas reais por título.</b> Depois do evento a debênture continua perdendo e o spread continua abrindo por semanas, então dá tempo de agir. Títulos com a ação −15% em 4 semanas perderam −5,7% a.a. vs o universo; rebaixados nos últimos 180 dias, −3,3% a.a.</li>
      <li><b>Eles quase não mudam a estratégia P4.</b> O P4 já evita a maioria desses nomes (caro vs pares ou com imprensa negativa), e só ~5% do universo está nessa situação ao mesmo tempo. Usamos como alerta e filtro de compra: “não comprar (ação caiu / rebaixado)”.</li>
      <li><b>Cadeia produtiva (commodities):</b> só ~11% do universo tem exposição relevante (açúcar/etanol, óleo e gás, petroquímica, mineração). O sinal existe contra o placebo, mas é pequeno demais para importar (≈ +0,02% a.a.).</li>
      <li><b>Regulador:</b> o ganho aparente é inclinação setorial. Com as datas das decisões embaralhadas o resultado quase não muda (${num(L3.reg_placebo.real, 2)}% real vs ${num(L3.reg_placebo.shifted_mean, 2)}% deslocado). <b>Notícia setorial:</b> sem efeito.</li>
      <li><b>No ML</b>, só o bloco de ação ajudou (+0,25% a.a.). Mesmo assim o ML fica abaixo do P4.</li>
    </ul>
  </div>
  ${D.img.events ? `<div class="panel"><h2>O crédito anda depois do sinal?</h2><figure><img src="${D.img.events}" alt="Estudos de evento: retorno e spread acumulados em volta de cada tipo de evento"><figcaption>Semana 0 = evento público. À direita de 0 é o que ainda dá para capturar.</figcaption></figure>
    <div class="scroll" style="margin-top:10px"><table>
      <tr><th>Evento</th><th class="n">casos</th><th class="n">retorno nas 13 semanas seguintes</th><th class="n">t</th><th class="n">spread depois</th><th class="n">t</th></tr>
      ${L3.events.map(e => `<tr><td>${esc(e.name)}</td><td class="n">${num(e.n)}</td><td class="n ${e.post < 0 ? "down" : "up"}">${sgn(e.post)} bps</td><td class="n">${num(e.post_t, 1)}</td><td class="n">${sgn(e.spread)} bps</td><td class="n">${num(e.spread_t, 1)}</td></tr>`).join("")}
    </table></div></div>` : ""}
  <div class="panel"><h2>P4 com os novos sinais</h2>

      <tr><th>Estratégia</th><th class="n">vs universo</th><th class="n">exec. +2 sem.</th><th class="n">custo 50 bps</th><th class="n">Sharpe</th><th class="n">Max DD</th><th class="n">vs P4 (t)</th></tr>

        <td class="n">${num(s.sharpe, 2)}</td><td class="n">${num(s.dd, 1)}%</td><td class="n">${p ? sgn(p.diff, 2) + "% (" + num(p.t, 1) + ")" : "—"}</td></tr>`; }).join("")}
    </table></div>
    <p class="note">Nenhuma variante melhora o P4 de forma estatisticamente significativa (correção para múltiplos testes). “Diag” são carteiras só com os títulos afetados, para medir o sinal.</p>
    <h3>ML: adicionando um bloco de dados por vez</h3>
    <div class="scroll"><table>
      <tr><th>Modelo</th><th class="n">IC</th><th class="n">vs universo</th><th class="n">exec. +2 sem.</th><th class="n">custo 50 bps</th><th class="n">Sharpe</th></tr>
      ${L3.ablation.map(a => `<tr><td>${esc(a.name)}</td><td class="n">${num(a.ic, 3)}</td><td class="n">${sgn(a.vs, 2)}%</td><td class="n">${sgn(a.lag2, 2)}%</td><td class="n">${sgn(a.c50, 2)}%</td><td class="n">${num(a.sharpe, 2)}</td></tr>`).join("")}
    </table></div>
  </div>`;
$("pesquisa").innerHTML = lab3Html + `
  <div class="panel"><h2>Laboratório de estratégias com notícias point-in-time</h2>
    <p class="note" style="margin-top:0">Semanal, fora da amostra 2022–2026, retornos de crédito puro (juros hedgeados com DI×Pré / NTN-B), decisão na segunda com dados até domingo, execução nos negócios da semana seguinte, 25 bps por giro. Robustez: execução 2 semanas depois e custo de 50 bps. Notícias: CVM IPE (286 mil documentos) e imprensa via Google News (32 mil manchetes negativas de 217 emissores).</p>
    <div class="scroll" style="margin-top:10px"><table>
      <tr><th>Estratégia</th><th class="n">vs universo</th><th class="n">exec. +2 sem.</th><th class="n">custo 50 bps</th><th class="n">Sharpe</th><th class="n">Max DD</th><th class="n">nº títulos</th></tr>
      ${lab.map(r => `<tr class="${(r.strategy || "").startsWith("P4") ? "star" : ""}"><td>${esc(r.strategy)}</td>
        <td class="n ${(r.vs_u0 ?? 0) > 0 ? "up" : "down"}">${sgn(r.vs_u0, 2)}%</td><td class="n">${sgn(r.vs_u0_lag2, 2)}%</td><td class="n">${sgn(r.vs_u0_50bps, 2)}%</td>
        <td class="n">${num(r.sharpe, 2)}</td><td class="n">${num(r.max_dd, 1)}%</td><td class="n">${num(r.n)}</td></tr>`).join("")}
    </table></div>
    <ul class="find">
      <li><b>Em uso: P4</b>, carry alto sem estar caro vs pares, sem comprar emissor com notícia negativa recente, e CDI quando o regime está defensivo.</li>
      <li>Notícia negativa prevê perda (−1,5% a.a. para emissores com pico de imprensa), mas vender depois da notícia não ajuda: o preço já andou. Ela funciona como filtro de compra.</li>
      <li>Títulos caros vs pares perdem cerca de −3,8% a.a. mesmo com juros hedgeados. É o sinal de venda mais forte.</li>

  </div>
  ${D.img.lab ? `<div class="panel"><figure><img src="${D.img.lab}" alt="Curvas de capital das estratégias do laboratório, 2022 a 2026"><figcaption>Excesso acumulado sobre o CDI por família de estratégia. Linha tracejada: comprar e segurar o universo.</figcaption></figure></div>` : ""}
  <div class="grid2">
    ${D.img.timing ? `<div class="panel"><h2>Timing de crédito (2013–2026)</h2><figure><img src="${D.img.timing}" alt="Curvas do modelo de timing de crédito"><figcaption>DI+: regra de momentum de 21 dias. IPCA+: modelo logístico. O ganho vem de evitar 2 ou 3 crises.</figcaption></figure></div>` : ""}
