# Free public website: GitHub Actions runs the monitor on a schedule and publishes a read-only dashboard
# to GitHub Pages → https://max-nickerson.github.io/renda-fixa-monitor/
name: site

on:
  schedule:
    - cron: "*/30 12-23 * * 1-5"   # every 30 min, 09:00–20:30 Brasília, Mon–Fri
    - cron: "45 0 * * 2-6"          # 21:45 Brasília, after ANBIMA publishes the day's prices
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["public/watchlist.yaml", "rfmonitor/**", ".github/workflows/site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      ANBIMA_CLIENT_ID: ${{ secrets.ANBIMA_CLIENT_ID }}
      ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET }}
      RFM_DATA_DIR: ${{ github.workspace }}/data
      RFM_WATCHLIST: ${{ github.workspace }}/public/watchlist.yaml
      ENABLE_ML_SELECTION: "false"
      BACKFILL_DAYS: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore state (database, caches, daily models)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: rfm-data-${{ github.run_id }}
          restore-keys: rfm-data-
      - name: Collect, rank, export
        run: python -m rfmonitor site
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: rfm-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
